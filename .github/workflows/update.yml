name: Mark Six Auto Scraper

on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push
        run: |
          git config --global user.name 'Mark Six Bot'
          git config --global user.email 'bot@marksix.hk'
          git add data.csv
          git commit -m "Auto-update: Latest Mark Six results" || exit 0
          git push
