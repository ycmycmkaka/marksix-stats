<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>香港六合彩 (Mark Six) 走勢分析</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --border: #dbe4f0;
      --text: #122033;
      --muted: #5f7087;
      --blue: #1f7cff;
      --blue-soft: rgba(31, 124, 255, 0.16);
      --amber: #f59e0b;
      --green: #20a34a;
      --red: #e3342f;
      --track: #d9dee7;
      --shadow: 0 10px 28px rgba(18, 32, 51, 0.08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: linear-gradient(180deg, #f9fbff 0%, #f3f6fb 100%);
      color: var(--text);
    }

    .container {
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -0.02em;
    }

    .subline {
      color: var(--muted);
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.6;
    }

    .filter-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 14px;
      color: var(--muted);
      font-weight: 700;
    }

    .filter-input {
      width: 120px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .metric-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .metric-value {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.15;
      word-break: break-word;
    }

    .layout-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 18px;
      margin-bottom: 20px;
    }

    .layout-5 {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .balls-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .ball-stat {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 10px;
      text-align: center;
    }

    .ball-number {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 8px;
      color: var(--blue);
    }

    .ball-count {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .analysis-card,
    .compare-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .analysis-title,
    .compare-title {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 800;
      color: var(--blue);
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 4px solid #e5eefb;
    }

    .analysis-row {
      display: grid;
      grid-template-columns: 1fr 140px 56px;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 700;
      color: #4d5e74;
    }

    .bar-track {
      height: 18px;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
    }

    .blue { background: var(--blue); }
    .green { background: var(--green); }
    .red { background: var(--red); }

    .compare-input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }

    .compare-input {
      flex: 1;
      min-width: 260px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      background: #fff;
    }

    .compare-btn {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .compare-btn:hover {
      opacity: 0.92;
    }

    .compare-result-wrap {
      display: grid;
      gap: 10px;
    }

    .compare-summary {
      padding: 12px;
      border-radius: 12px;
      background: #eef6ff;
      border: 1px solid #dbeafe;
      line-height: 1.7;
      font-size: 14px;
    }

    .compare-hit-card {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f8fbff;
      line-height: 1.7;
      font-size: 14px;
    }

    .match-balls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .match-ball {
      display: inline-flex;
      min-width: 30px;
      height: 30px;
      border-radius: 999px;
      align-items: center;
      justify-content: center;
      background: rgba(31, 124, 255, 0.14);
      color: #1f7cff;
      border: 1px solid #bcd6ff;
      font-weight: 700;
      font-size: 13px;
      padding: 0 8px;
    }

    .table-topline {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 14px;
    }

    .table-note {
      color: var(--muted);
      font-size: 13px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      min-width: 1050px;
    }

    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #e8eef6;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-weight: 700;
      background: #f8fbff;
      position: sticky;
      top: 0;
      z-index: 1;
      white-space: nowrap;
    }

    .num-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 240px;
      align-items: center;
    }

    .num-ball {
      display: inline-flex;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      border: 1px solid #ccc;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.08);
    }

    .special-box {
      padding: 4px;
      border: 2px dashed #ff9900;
      border-radius: 10px;
      display: inline-flex;
      background: #fffcf0;
      margin-left: 2px;
    }

    .table-pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      line-height: 1;
      white-space: nowrap;
    }

    .table-pill.green {
      background: rgba(32, 163, 74, 0.14);
      color: #17833a;
    }

    .table-pill.red {
      background: rgba(227, 52, 47, 0.14);
      color: #c92d28;
    }

    .table-pill.blue {
      background: rgba(31, 124, 255, 0.12);
      color: #1f7cff;
    }

    .repeat-nums {
      font-weight: bold;
      color: #d93025;
      background: #fdf2f2;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 4px;
    }

    .empty-note {
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
    }

    @media (max-width: 1380px) {
      .layout-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 1100px) {
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .layout-3, .layout-5 { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 760px) {
      .container { padding: 14px; }
      .metrics { grid-template-columns: 1fr; }
      .layout-3, .layout-5 { grid-template-columns: 1fr; }
      .balls-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .analysis-row { grid-template-columns: 1fr 120px 52px; }
      h1 { font-size: 28px; }
      .metric-value { font-size: 24px; }
      .filter-bar { justify-content: flex-start; }
      .compare-input-row { flex-direction: column; align-items: stretch; }
      .compare-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>香港六合彩 (Mark Six) 走勢分析</h1>
      <div class="subline" id="status">最後更新時間：載入中…</div>
    </div>

    <div class="filter-bar">
      <label for="drawLimitInput" class="filter-label">統計期數：</label>
      <input
        id="drawLimitInput"
        class="filter-input"
        type="number"
        min="1"
        step="1"
        placeholder="全部"
      />

      <label for="zoneFilterSelect" class="filter-label">分區篩選：</label>
      <select id="zoneFilterSelect" class="filter-input">
        <option value="">全部</option>
        <option value="1">1個區</option>
        <option value="2">2個區</option>
        <option value="3">3個區</option>
        <option value="4">4個區</option>
        <option value="5">5個區</option>
      </select>
    </div>

    <div class="metrics">
      <div class="card">
        <div class="metric-label">統計期數</div>
        <div class="metric-value" id="totalDraws">-</div>
      </div>
      <div class="card">
        <div class="metric-label">最後更新時間</div>
        <div class="metric-value" id="lastUpdated">-</div>
      </div>
      <div class="card">
        <div class="metric-label">最熱門主號碼</div>
        <div class="metric-value" id="topMain">-</div>
      </div>
    </div>

    <div class="layout-3">
      <div class="card">
        <h2 class="section-title">最熱門主號碼 Top 6</h2>
        <div class="balls-grid" id="hotMainNumbers"></div>
      </div>
      <div class="card">
        <h2 class="section-title">最冷門主號碼 Top 6</h2>
        <div class="balls-grid" id="coldMainNumbers"></div>
      </div>
      <div class="card">
        <h2 class="section-title">連續 15 期或以上未開號碼</h2>
        <div class="balls-grid" id="missingLongGrid"></div>
      </div>
    </div>

    <div class="compare-card" style="margin-bottom:20px;">
      <h2 class="compare-title">歷史對比查詢（輸入 6 個主號碼）</h2>
      <div class="compare-input-row">
        <input id="compareInput" class="compare-input" type="text" placeholder="例如：3,8,15,19,23,29" />
        <button id="compareBtn" class="compare-btn">開始比對</button>
      </div>
      <div id="compareResult" class="empty-note">輸入 6 個不重複主號碼，系統會幫你搵出歷史上最多相同號碼嘅期數。</div>
    </div>

    <div class="layout-5">
      <div class="analysis-card">
        <h2 class="analysis-title">顏色分佈 (全7球)</h2>
        <div id="colorDist"></div>
      </div>

      <div class="analysis-card">
        <h2 class="analysis-title">主號碼單雙分佈</h2>
        <div id="oddEvenDist"></div>
      </div>

      <div class="analysis-card">
        <h2 class="analysis-title">主號碼連續</h2>
        <div id="consecutiveDist"></div>
      </div>

      <div class="analysis-card">
        <h2 class="analysis-title">主號碼重複</h2>
        <div id="repeatDist"></div>
      </div>

      <div class="analysis-card">
        <h2 class="analysis-title">主號碼分區</h2>
        <div id="zoneDist"></div>
      </div>
    </div>

    <div class="card">
      <div class="table-topline">
        <h2 class="section-title" style="margin-bottom:0;">最近開獎記錄</h2>
        <div class="table-note" id="tableNote">顯示全部記錄</div>
      </div>
      <div class="table-wrap" id="table-container"></div>
    </div>
  </div>

  <script>
    let allRows = [];
    let lastUpdatedDisplay = "-";

    function getBallColor(num) {
      const n = parseInt(num, 10);
      const red = [1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46];
      const blue = [3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48];
      const green = [5,6,11,16,17,21,22,27,28,32,33,38,39,43,44,49];

      if (red.includes(n)) return { bg: '#ffeeee', border: '#e60000', color: '#e60000', name: '紅波' };
      if (blue.includes(n)) return { bg: '#eeeeff', border: '#0000e6', color: '#0000e6', name: '藍波' };
      if (green.includes(n)) return { bg: '#eeffee', border: '#00b300', color: '#00b300', name: '綠波' };
      return { bg: '#fff', border: '#ccc', color: '#333', name: '未知' };
    }

    function getFilteredRowsByLimit(rows) {
      const rawValue = document.getElementById("drawLimitInput")?.value?.trim() || "";
      if (!rawValue) return rows;

      const limit = parseInt(rawValue, 10);
      if (isNaN(limit) || limit <= 0) return rows;

      return rows.slice(0, limit);
    }

    function getZoneCountValue(numbers) {
      return new Set(
        numbers.map(n => {
          if (n >= 1 && n <= 10) return 1;
          if (n <= 20) return 2;
          if (n <= 30) return 3;
          if (n <= 40) return 4;
          return 5;
        })
      ).size;
    }

    function formatDateTimeForDisplay(dateInput) {
      const d = new Date(dateInput);
      if (Number.isNaN(d.getTime())) return "-";
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    }

    function setLastUpdatedText(text) {
      document.getElementById("status").textContent = `最後更新時間：${text}`;
      document.getElementById("lastUpdated").textContent = text;
    }

    function parseUserNumbers(input) {
      const nums = input
        .split(/[^0-9]+/)
        .map(x => parseInt(x, 10))
        .filter(x => !isNaN(x));

      const uniqueNums = [...new Set(nums)];

      if (uniqueNums.length !== 6) {
        return { error: "請輸入 6 個不重複主號碼。" };
      }

      if (uniqueNums.some(n => n < 1 || n > 49)) {
        return { error: "號碼必須介乎 1 至 49。" };
      }

      uniqueNums.sort((a, b) => a - b);
      return { numbers: uniqueNums };
    }

    function compareUserNumbers(rows, userNumbers) {
      let maxMatch = 0;
      let bestRows = [];

      rows.forEach(row => {
        const drawNums = [];
        for (let i = 1; i <= 6; i++) {
          const v = parseInt(row['n' + i], 10);
          if (!isNaN(v)) drawNums.push(v);
        }

        const matched = userNumbers.filter(n => drawNums.includes(n));

        if (matched.length > maxMatch) {
          maxMatch = matched.length;
          bestRows = [{
            date: row.date || "-",
            drawNums,
            matched
          }];
        } else if (matched.length === maxMatch) {
          bestRows.push({
            date: row.date || "-",
            drawNums,
            matched
          });
        }
      });

      return { maxMatch, bestRows };
    }

    function runNumberComparison(rows) {
      const input = document.getElementById("compareInput").value.trim();
      const resultBox = document.getElementById("compareResult");

      const parsed = parseUserNumbers(input);
      if (parsed.error) {
        resultBox.innerHTML = `<span style="color:#d93025; font-weight:bold;">${parsed.error}</span>`;
        return;
      }

      const result = compareUserNumbers(rows, parsed.numbers);

      if (!result.bestRows.length || result.maxMatch === 0) {
        resultBox.innerHTML = `冇搵到任何一期有相同主號碼。`;
        return;
      }

      resultBox.innerHTML = `
        <div class="compare-result-wrap">
          <div class="compare-summary">
            <div><strong>你輸入嘅主號碼：</strong>${parsed.numbers.join(", ")}</div>
            <div><strong>歷史最多相同主號碼：</strong>${result.maxMatch} 個</div>
          </div>
          ${result.bestRows.map(r => `
            <div class="compare-hit-card">
              <div><strong>期數：</strong>${r.date}</div>
              <div><strong>當期主號碼：</strong>${r.drawNums.join(", ")}</div>
              <div><strong>相同號碼：</strong></div>
              <div class="match-balls">
                ${r.matched.map(n => `<span class="match-ball">${n}</span>`).join("") || "無"}
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderProgressRows(containerId, items) {
      const container = document.getElementById(containerId);
      container.innerHTML = items.map(item => `
        <div class="analysis-row">
          <div>${item.label}</div>
          <div class="bar-track">
            <div class="bar-fill ${item.color}" style="width:${item.pct}%"></div>
          </div>
          <div>${item.pct}%</div>
        </div>
      `).join("");
    }

    function renderNumberBoxes(containerId, items, suffix, emptyText = "") {
      const el = document.getElementById(containerId);
      if (!items.length) {
        el.innerHTML = `<div class="empty-note">${emptyText}</div>`;
        return;
      }

      el.innerHTML = items.map(item => `
        <div class="ball-stat">
          <div class="ball-number">${item.num}</div>
          <div class="ball-count">${item.value}${suffix}</div>
        </div>
      `).join("");
    }

    function percent(count, total) {
      return total ? Math.round((count / total) * 100) : 0;
    }

    function calculateMissingStreaks(rows) {
      const results = [];

      for (let num = 1; num <= 49; num++) {
        let missing = 0;
        let found = false;

        for (let i = 0; i < rows.length; i++) {
          const rowNums = [];
          for (let j = 1; j <= 6; j++) {
            const v = parseInt(rows[i]['n' + j], 10);
            if (!isNaN(v)) rowNums.push(v);
          }

          if (rowNums.includes(num)) {
            found = true;
            break;
          }
          missing += 1;
        }

        results.push({
          num,
          value: found ? missing : rows.length
        });
      }

      return results;
    }

    function renderMetrics(totalDraws, hotNumbers) {
      document.getElementById("totalDraws").textContent = totalDraws;
      const topMain = hotNumbers[0];
      document.getElementById("topMain").textContent = topMain ? `${topMain.num} (${topMain.value}次)` : "-";
      document.getElementById("lastUpdated").textContent = lastUpdatedDisplay;
    }

    function renderDashboard(data) {
      const filteredRows = getFilteredRowsByLimit(data);

      let totalDraws = 0;
      let totalBalls = 0;

      let s = {
        oe: { '6單 0雙':0, '5單 1雙':0, '4單 2雙':0, '3單 3雙':0, '2單 4雙':0, '1單 5雙':0, '0單 6雙':0 },
        consec: {},
        repeats: { '0個':0, '1個':0, '2個+':0 },
        zones: {},
        colors: { '紅波':0, '藍波':0, '綠波':0 }
      };

      let mainFreq = {};
      for (let i = 1; i <= 49; i++) mainFreq[i] = 0;

      filteredRows.forEach(row => {
        if (!row.n1) return;
        totalDraws++;

        for (let i = 1; i <= 6; i++) {
          const v = parseInt(row['n' + i], 10);
          if (!isNaN(v) && mainFreq[v] !== undefined) mainFreq[v] += 1;
        }

        if (s.oe[row.odd_even] !== undefined) s.oe[row.odd_even]++;

        const consecVal = row['consecutive'] || '0 個連續';
        s.consec[consecVal] = (s.consec[consecVal] || 0) + 1;

        const repeatCount = parseInt((row.repeats || "0").split("個")[0], 10) || 0;
        if (repeatCount === 0) s.repeats['0個']++;
        else if (repeatCount === 1) s.repeats['1個']++;
        else s.repeats['2個+']++;

        if (row.zone) {
          const z = row.zone.charAt(0) + '個區';
          s.zones[z] = (s.zones[z] || 0) + 1;
        }

        const allBalls = [row.n1, row.n2, row.n3, row.n4, row.n5, row.n6, row.special];
        allBalls.forEach(b => {
          if (b) {
            const colorInfo = getBallColor(b);
            if (s.colors[colorInfo.name] !== undefined) {
              s.colors[colorInfo.name]++;
              totalBalls++;
            }
          }
        });
      });

      const hotNumbers = Object.entries(mainFreq)
        .map(([num, count]) => ({ num: Number(num), value: count }))
        .sort((a, b) => b.value - a.value || a.num - b.num)
        .slice(0, 6);

      const coldNumbers = Object.entries(mainFreq)
        .map(([num, count]) => ({ num: Number(num), value: count }))
        .sort((a, b) => a.value - b.value || a.num - b.num)
        .slice(0, 6);

      const missing15Plus = calculateMissingStreaks(filteredRows)
        .filter(item => item.value >= 15)
        .sort((a, b) => b.value - a.value || a.num - b.num);

      renderMetrics(totalDraws, hotNumbers);

      renderNumberBoxes("hotMainNumbers", hotNumbers, "次");
      renderNumberBoxes("coldMainNumbers", coldNumbers, "次");
      renderNumberBoxes("missingLongGrid", missing15Plus, "期未開", "目前冇主號碼連續 15 期或以上未開");

      const colorItems = ['紅波', '藍波', '綠波']
        .map(label => ({
          label,
          pct: percent(s.colors[label] || 0, totalBalls),
          color: label === '紅波' ? 'red' : (label === '綠波' ? 'green' : 'blue')
        }));
      renderProgressRows("colorDist", colorItems);

      const oeItems = Object.entries(s.oe)
        .filter(([,count]) => count > 0)
        .map(([label, count]) => ({ label, pct: percent(count, totalDraws), color: 'blue' }));
      renderProgressRows("oddEvenDist", oeItems);

      const consecOrder = ["0 個連續", "1 個連續", "2 個連續", "3 個連續", "4 個連續", "5 個連續"];
      const consecItems = consecOrder
        .filter(label => s.consec[label] !== undefined)
        .map(label => ({
          label: label.replace(" ", ""),
          pct: percent(s.consec[label], totalDraws),
          color: label === "0 個連續" ? "red" : "green"
        }));
      renderProgressRows("consecutiveDist", consecItems);

      const repeatItems = [
        { label: "0個", count: s.repeats["0個"] || 0 },
        { label: "1個", count: s.repeats["1個"] || 0 },
        { label: "2個+", count: s.repeats["2個+"] || 0 }
      ].map(item => ({
        label: item.label,
        pct: percent(item.count, totalDraws),
        color: "blue"
      }));
      renderProgressRows("repeatDist", repeatItems);

      const zoneItems = [5, 4, 3, 2, 1]
        .filter(z => s.zones[`${z}個區`] !== undefined)
        .map(z => ({
          label: `${z}個區`,
          pct: percent(s.zones[`${z}個區`], totalDraws),
          color: "blue"
        }));
      renderProgressRows("zoneDist", zoneItems);
    }

    function renderTable(data) {
      const selectedZone = document.getElementById("zoneFilterSelect")?.value || "";

      const validRows = data.filter(r => {
        if (!r.n1) return false;
        if (!selectedZone) return true;

        const rowNums = [];
        for (let i = 1; i <= 6; i++) {
          const v = parseInt(r['n' + i], 10);
          if (!isNaN(v)) rowNums.push(v);
        }

        return getZoneCountValue(rowNums) === parseInt(selectedZone, 10);
      });

      document.getElementById("tableNote").textContent = selectedZone
        ? `顯示 ${selectedZone}個區記錄，共 ${validRows.length} 期`
        : `顯示全部 ${validRows.length} 期`;

      let html = '<table><thead><tr><th>攪珠日期</th><th>主號碼 (6 Balls)</th><th>特別號碼</th><th>主號碼單雙</th><th>連續號碼</th><th>上期重複冧莊</th><th>分區</th></tr></thead><tbody>';

      validRows.forEach(row => {
        let balls = '';
        for (let i = 1; i <= 6; i++) {
          const c = getBallColor(row['n' + i]);
          balls += `<span class="num-ball" style="background:${c.bg}; border:1px solid ${c.border}; color:${c.color}">${row['n' + i]}</span>`;
        }

        const spColor = getBallColor(row.special);
        const spHtml = `<div class="special-box"><span class="num-ball" style="background:${spColor.bg}; border:2px solid ${spColor.border}; color:${spColor.color}; margin:0;">${row.special}</span></div>`;

        let formattedRepeats = row.repeats || '-';
        if (formattedRepeats.includes("(")) {
          formattedRepeats = formattedRepeats.replace("(", "<br><span class='repeat-nums'>(").replace(")", ")</span>");
        }

        const consecVal = row['consecutive'] || '0 個連續';
        const consecHtml = consecVal !== '0 個連續'
          ? `<span class="table-pill green">${consecVal}</span>`
          : `<span class="table-pill red">${consecVal}</span>`;

        html += `<tr>
          <td style="font-weight:700; color:#555; white-space:nowrap;">${row.date}</td>
          <td><div class="num-row">${balls}</div></td>
          <td>${spHtml}</td>
          <td><strong>${row.odd_even || '-'}</strong></td>
          <td>${consecHtml}</td>
          <td style="line-height:1.45;">${formattedRepeats}</td>
          <td><span class="table-pill blue">${row.zone || '-'}</span></td>
        </tr>`;
      });

      html += '</tbody></table>';
      document.getElementById('table-container').innerHTML = html;
    }

    async function loadAll() {
      const csvUrl = "data.csv?t=" + new Date().getTime();

      try {
        const headRes = await fetch(csvUrl, { method: "HEAD" });
        const lastMod = headRes.headers.get("Last-Modified");

        if (lastMod) {
          lastUpdatedDisplay = formatDateTimeForDisplay(lastMod);
        } else {
          lastUpdatedDisplay = "-";
        }
        setLastUpdatedText(lastUpdatedDisplay);
      } catch {
        lastUpdatedDisplay = "-";
        setLastUpdatedText(lastUpdatedDisplay);
      }

      Papa.parse(csvUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const data = results.data;
          if (!data.length || !data[0].n1) {
            document.getElementById('table-container').innerHTML = "<p style='text-align:center; color:red;'>未搵到數據，請稍後再試。</p>";
            return;
          }

          allRows = data.filter(r => r.n1);
          renderDashboard(allRows);
          renderTable(allRows);
        },
        error: function(err) {
          document.getElementById('table-container').innerHTML = `<p style="color:red; text-align:center; padding:20px;"><b>讀取 CSV 失敗：</b><br>${err}</p>`;
        }
      });
    }

    document.getElementById("drawLimitInput").addEventListener("input", () => {
      if (allRows.length) renderDashboard(allRows);
    });

    document.getElementById("zoneFilterSelect").addEventListener("change", () => {
      if (allRows.length) renderTable(allRows);
    });

    document.getElementById("compareBtn").addEventListener("click", () => {
      if (allRows.length) runNumberComparison(allRows);
    });

    document.getElementById("compareInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && allRows.length) {
        runNumberComparison(allRows);
      }
    });

    loadAll();
  </script>
</body>
</html>
